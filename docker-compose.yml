services:
  training:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: training
    image: vcsdeploy-training
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./configs:/app/configs
      - ./src:/app/src
      - ./experiments:/app/experiments
      - ./mlflow.db:/app/mlflow.db
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /app
    stdin_open: true
    tty: true
    command: uv run -m src.services.training --config configs/training.json

  export:
